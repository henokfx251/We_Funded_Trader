
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | We Funded Trader</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#07111f;
  --panel:#101d30;
  --panel2:#14243a;
  --gold:#e8b84b;
  --gold2:#f5d27c;
  --text:#f4f7fb;
  --muted:#94a3b8;
  --line:#26374d;
}

body{
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:440px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:35px 28px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
}

.logo{
  text-align:center;
  font-size:23px;
  font-weight:800;
  letter-spacing:.5px;
  color:var(--text);
}

.logo span{color:var(--gold)}

.logo-line{
  width:55px;
  height:3px;
  background:var(--gold);
  border-radius:5px;
  margin:13px auto 25px;
}

h2{
  text-align:center;
  font-size:27px;
  margin-bottom:9px;
}

.sub{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  line-height:1.6;
  margin-bottom:28px;
}

label{
  display:block;
  margin:17px 0 8px;
  font-size:14px;
  color:#cbd5e1;
}

input{
  width:100%;
  padding:15px;
  background:#071525;
  border:1px solid var(--line);
  border-radius:9px;
  color:white;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 2px rgba(232,184,75,.12);
}

button{
  width:100%;
  padding:15px;
  margin-top:25px;
  border:0;
  border-radius:9px;
  background:var(--gold);
  color:#111827;
  font-weight:800;
  font-size:16px;
  cursor:pointer;
  transition:.2s;
}

button:hover{background:var(--gold2)}
button:disabled{opacity:.6;cursor:not-allowed}

.links{
  text-align:center;
  margin-top:23px;
  color:var(--muted);
  font-size:14px;
  line-height:1.8;
}

a{
  color:var(--gold);
  text-decoration:none;
  font-weight:600;
}

a:hover{color:var(--gold2)}

.back{
  display:block;
  text-align:center;
  margin-top:22px;
  color:var(--muted);
  font-size:13px;
}

.message{
  margin-top:15px;
  text-align:center;
  font-size:14px;
  line-height:1.5;
  overflow-wrap:anywhere;
}

.footer{
  text-align:center;
  color:#64748b;
  font-size:11px;
  margin-top:25px;
}

@media(max-width:480px){
  .box{padding:30px 21px}
  h2{font-size:24px}
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">WE <span>FUNDED</span> TRADER</div>
  <div class="logo-line"></div>

  <h2>Welcome Back</h2>
  <p class="sub">Login to access your trading dashboard.</p>

  <form id="loginForm">

    <label for="email">Email Address</label>
    <input
      type="email"
      id="email"
      placeholder="Enter your email address"
      autocomplete="email"
      required
    >

    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      required
    >

    <button type="submit" id="loginButton">Log In</button>

    <p class="message" id="loginMessage" role="status"></p>

  </form>

  <div class="links">
    Don't have an account?
    <a href="register.html">Create Account</a>
  </div>

  <a class="back" href="index.html">← Back to Homepage</a>

  <div class="footer">
    © 2026 WE FUNDED TRADER. All rights reserved.
  </div>

</div>

<script type="module">
import { supabase } from "./supabase.js";

const form = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginButton = document.getElementById("loginButton");
const message = document.getElementById("loginMessage");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!email || !password) {
    message.style.color = "#ef4444";
    message.textContent = "Please enter your email and password.";
    return;
  }

  loginButton.disabled = true;
  loginButton.textContent = "Logging in...";
  message.style.color = "#cbd5e1";
  message.textContent = "Please wait...";

  try {
    const { data, error } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;

    if (data.session) {
      message.style.color = "#22c55e";
      message.textContent = "Login successful. Redirecting...";

      window.location.href = "dashboard.html";
      return;
    }

    throw new Error("Login session could not be created.");

  } catch (error) {
    message.style.color = "#ef4444";
    message.textContent = error.message || "Login failed. Please try again.";

    loginButton.disabled = false;
    loginButton.textContent = "Log In";
  }
});
</script>

</body>
</html>
