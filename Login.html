<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f6fb">
  <meta name="description" content="Log in to your WE FUNDED TRADER account.">
  <title>Login | WE FUNDED TRADER</title>
  <style id="wft-auth-final">
:root{color-scheme:light;--wft-blue:#155eef;--wft-ink:#111827;--wft-muted:#64748b;--wft-line:#dbe3ee}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0;background:#f3f6fb!important;color:#111827!important}
body{min-height:100svh;display:grid;place-items:center;padding:24px 16px!important;font-family:Inter,Arial,sans-serif!important}
.auth-shell{width:min(100%,480px)!important;margin:0 auto!important}
.brand{text-align:center;background:transparent!important;margin:0 0 20px!important}
.brand-name{color:#111827!important;font-size:23px!important;font-weight:900!important;letter-spacing:.4px}
.brand-name span{color:#155eef!important}
.brand-caption{color:#64748b!important;letter-spacing:1.4px!important}
.brand-line{background:#155eef!important}
.auth-shell .card{width:100%;padding:clamp(22px,5vw,34px)!important;background:#fff!important;background-image:none!important;color:#111827!important;border:1px solid #dbe3ee!important;border-radius:18px!important;box-shadow:0 12px 34px rgba(15,23,42,.08)!important}
.auth-shell .eyebrow{color:#155eef!important}
.auth-shell .eyebrow:before,.auth-shell .eyebrow:after{background:#bfdbfe!important}
.auth-shell h1{color:#111827!important;font-size:clamp(25px,6vw,30px)!important}
.auth-shell .subtitle{color:#64748b!important}
.auth-shell .field label,.auth-shell label{color:#111827!important}
.auth-shell .field input,.auth-shell input:not([type=checkbox]):not([type=radio]){display:block;width:100%!important;min-height:50px!important;padding:0 14px!important;background:#fff!important;background-image:none!important;color:#111827!important;border:1px solid #cbd5e1!important;border-radius:10px!important;font-size:15px!important}
.auth-shell input::placeholder{color:#94a3b8!important}
.auth-shell input:focus{border-color:#155eef!important;box-shadow:0 0 0 3px rgba(21,94,239,.12)!important;outline:none}
.auth-shell .toggle-password{background:#155eef!important;color:#fff!important;border:1px solid #155eef!important;border-radius:7px!important;padding:8px 11px!important}
.auth-shell .form-row{display:flex!important;justify-content:flex-end!important;align-items:center!important;flex-wrap:wrap!important;margin:14px 0 4px!important}
.auth-shell .form-row a,.auth-shell .forgot-password-link{display:inline-flex!important;align-items:center!important;justify-content:center!important;padding:9px 13px!important;background:#eff6ff!important;color:#155eef!important;border:1px solid #bfdbfe!important;border-radius:8px!important;font-size:13px!important;font-weight:800!important}
.auth-shell .submit{display:block;width:100%!important;min-height:52px!important;margin-top:22px!important;background:#155eef!important;background-image:none!important;color:#fff!important;border:1px solid #155eef!important;border-radius:10px!important;box-shadow:0 7px 18px rgba(21,94,239,.18)!important;font-weight:900!important}
.auth-shell .submit:hover{background:#104fc7!important;color:#fff!important}
.auth-shell .submit:disabled{opacity:.6!important}
.auth-shell .message{color:#475569!important;overflow-wrap:anywhere}
.auth-shell .message.error{color:#b91c1c!important}
.auth-shell .message.success{color:#15803d!important}
.auth-shell .message.info{color:#475569!important}
.auth-shell .password-hint,.auth-shell .footer{color:#64748b!important}
.auth-shell .referral-note{background:#eff6ff!important;color:#1e40af!important;border:1px solid #bfdbfe!important}
.auth-shell .switch{color:#64748b!important}
.auth-shell .back,.auth-shell a{color:#155eef!important;font-weight:700!important}
.auth-shell .switch a{color:#155eef!important}
@media(max-width:520px){
 body{padding:18px 14px!important;align-items:center!important}
 .auth-shell{width:100%!important;max-width:460px!important}
 .auth-shell .card{padding:24px 19px!important;border-radius:15px!important}
 .auth-shell .field{margin-top:15px!important}
}
</style>
</head>
<body>
  <main class="auth-shell">
    <header class="brand">
      <div class="brand-name">WE <span>FUNDED</span> TRADER</div>
      <div class="brand-caption">Trade with confidence</div>
      <div class="brand-line"></div>
    </header>

    <section class="card" aria-labelledby="pageTitle">
      <div class="eyebrow">Member Access</div>
      <h1 id="pageTitle">Welcome Back</h1>
      <p class="subtitle">Log in to access your trading dashboard and account.</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email Address</label>
          <input id="email" name="email" type="email" placeholder="name@example.com" autocomplete="email" inputmode="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input class="password-input" id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
            <button class="toggle-password" type="button" data-toggle="password" aria-label="Show password">SHOW</button>
          </div>
        </div>
        <div class="form-row"><a class="forgot-password-link" href="forgot-password.html">Forgot Password? — Reset it here</a></div>
        <button class="submit" id="loginButton" type="submit">LOG IN TO ACCOUNT</button>
        <p class="message" id="loginMessage" role="status" aria-live="polite"></p>
      </form>

      <div class="switch">New to WFT? <a href="register.html">Create an account</a></div>
    </section>

    <a class="back" href="index.html">← Back to Homepage</a>
    <footer class="footer">© 2026 WE FUNDED TRADER. All rights reserved.</footer>
  </main>

  <script type="module">
    import { supabase } from "./supabase.js";

    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("loginMessage");

    function showMessage(text, type = "info") {
      message.textContent = text;
      message.className = "message " + type;
    }

    document.querySelector('[data-toggle="password"]').addEventListener("click", (event) => {
      const visible = passwordInput.type === "text";
      passwordInput.type = visible ? "password" : "text";
      event.currentTarget.textContent = visible ? "SHOW" : "HIDE";
      event.currentTarget.setAttribute("aria-label", visible ? "Show password" : "Hide password");
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      // Supabase email sign-in is case-insensitive; normalize accidental spaces/case.
      const email = emailInput.value.trim().toLowerCase();
      // Do NOT trim passwords: leading/trailing spaces may be intentional.
      const password = passwordInput.value;

      if (!email || !password) {
        showMessage("Enter your email address and password.", "error");
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "SIGNING IN...";
      showMessage("Please wait while we securely sign you in.");

      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
          if (error.message && /email not confirmed/i.test(error.message)) {
            throw new Error("Please confirm your email address before logging in. Check your Inbox and Spam folder.");
          }
          if (error.message && /invalid login credentials/i.test(error.message)) {
            throw new Error("Supabase could not verify this email/password pair. Check the email address, or use Forgot Password to set a new password.");
          }
          if (error.message && /too many requests/i.test(error.message)) {
            throw new Error("Too many login attempts. Please wait a few minutes and try again.");
          }
          throw new Error(error.message || "Login failed. Please try again.");
        }
        if (!data.session) throw new Error("Your login session could not be created. Please try again.");

        showMessage("Login successful. Opening your account...", "success");
        const params = new URLSearchParams(window.location.search);
        let requestedNext = params.get("next");

        // Return to the protected WFT page that sent the visitor to Login.
        if (!requestedNext && document.referrer) {
          try {
            const ref = new URL(document.referrer);
            const basePath = window.location.pathname.replace(/Login\.html$/i, "");
            if (ref.origin === window.location.origin &&
                ref.pathname.startsWith(basePath) &&
                /\.html$/i.test(ref.pathname) &&
                !/\/Login\.html$/i.test(ref.pathname)) {
              requestedNext = ref.pathname.slice(basePath.length) + ref.search + ref.hash;
            }
          } catch (_) {}
        }

        const allowedPages = new Set([
          "admin.html", "dashboard.html", "giveaway.html", "wallet.html",
          "orders.html", "checkout.html", "challenges.html",
          "customer-rewards.html", "customer-affiliate.html",
          "customer-support.html", "customer-payout.html",
          "customer-certificate.html"
        ]);
        const nextUrl = requestedNext ? new URL(requestedNext, window.location.href) : null;
        const safeNext = nextUrl &&
          nextUrl.origin === window.location.origin &&
          allowedPages.has(nextUrl.pathname.split("/").pop())
            ? nextUrl.pathname + nextUrl.search + nextUrl.hash
            : "dashboard.html";
        window.location.replace(safeNext);
      } catch (error) {
        showMessage(error.message || "Login failed. Please try again.", "error");
        loginButton.disabled = false;
        loginButton.textContent = "LOG IN TO ACCOUNT";
      }
    });
  </script>
</body>
</html>
