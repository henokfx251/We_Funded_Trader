
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | We Funded Trader</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,sans-serif;
background:#07111f;
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}
.box{
width:100%;
max-width:420px;
background:#101f33;
border:1px solid #263b55;
border-radius:16px;
padding:35px 28px;
}
.logo{text-align:center;font-size:23px;font-weight:bold}
.logo span{color:#2583ff}
h2{text-align:center;margin:25px 0 8px}
.sub{text-align:center;color:#a9b7ca;font-size:14px;margin-bottom:25px}
label{display:block;margin:15px 0 7px;font-size:14px}
input{
width:100%;
padding:14px;
background:#07111f;
border:1px solid #30445e;
border-radius:8px;
color:white;
outline:none;
}
input:focus{border-color:#2583ff}
button{
width:100%;
padding:14px;
margin-top:22px;
border:0;
border-radius:8px;
background:#2583ff;
color:white;
font-weight:bold;
font-size:16px;
}
.links{text-align:center;margin-top:22px;color:#a9b7ca;font-size:14px}
a{color:#65b4ff;text-decoration:none}
.back{display:block;text-align:center;margin-top:20px;color:#a9b7ca;font-size:13px}
.note{font-size:12px;color:#a9b7ca;margin-top:20px;text-align:center}
</style>
</head>
<body>

<div class="box">
<div class="logo">WE <span>FUNDED</span> TRADER</div>
<h2>Welcome Back</h2>
<p class="sub">Login to your trader dashboard</p>

<form id="loginForm">
<label>Email Address</label>
<input type="email" id="email" placeholder="Enter your email" required>

<label>Password</label>
<input type="password" id="password" placeholder="Enter your password" required>

<button type="submit">Log In</button>
</form>

<div class="links">
Don't have an account?
<a href="register.html">Sign Up</a>
</div>

<a class="back" href="index.html">← Back to Homepage</a>

<p class="note">
Demo login only. Real account authentication is not connected yet.
</p>
</div>

<script type="module">
import { supabase } from "./supabase.js";

const form = document.getElementById("loginForm");

const message = document.createElement("p");
message.style.cssText =
  "margin-top:15px;text-align:center;font-size:14px;";
form.appendChild(message);

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  message.style.color = "#ffffff";
  message.textContent = "Logging in...";

  const { data, error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    message.style.color = "#ff7777";
    message.textContent = error.message;
    return;
  }

  if (data.session) {
    window.location.href = "dashboard.html";
  }
});
</script>
</script>

</body>
</html>
