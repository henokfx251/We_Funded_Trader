
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | We Funded Trader</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #07111f;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: #101e31;
      border: 1px solid #203a59;
      border-radius: 16px;
      padding: 30px 24px;
      box-shadow: 0 15px 40px #0005;
    }

    .logo {
      text-align: center;
      color: #3195ff;
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    h2 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9aadc2;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #294663;
      background: #091728;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #3195ff;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: none;
      border-radius: 8px;
      background: #1684f8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .login-link {
      text-align: center;
      margin-top: 22px;
      color: #9aadc2;
      font-size: 14px;
    }

    a {
      color: #3195ff;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">WE FUNDED TRADER</div>

    <h2>Create Your Account</h2>
    <p class="subtitle">Join We Funded Trader today</p>

    <form id="registerForm">

      <label for="fullname">Full Name</label>
      <input
        type="text"
        id="fullname"
        placeholder="Enter your full name"
        autocomplete="name"
        required
      >

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Minimum 8 characters"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <label for="confirmPassword">Confirm Password</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <button type="submit" id="registerButton">
        Create Account
      </button>

      <p id="message" role="status"></p>

    </form>

    <div class="login-link">
      Already have an account?
      <a href="Login.html">Login</a>
    </div>

  </div>

  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL =
      "https://vxcwfirfgxrxafbirnwu.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_Nw1NaKkhz0A7H5TxybSzHA_9zjTeDLv";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const button = document.getElementById("registerButton");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const name = document.getElementById("fullname").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        message.style.color = "#ff7777";
        message.textContent = "Passwords do not match!";
        return;
      }

      if (password.length < 8) {
        message.style.color = "#ff7777";
        message.textContent =
          "Password must be at least 8 characters.";
        return;
      }

      button.disabled = true;
      button.textContent = "Creating Account...";
      message.style.color = "#ffffff";
      message.textContent = "Please wait...";

      try {
        const { data, error } = await supabase.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              full_name: name
            }
          }
        });

        if (error) {
          throw error;
        }

        message.style.color = "#42d392";
        message.textContent =
          "Account created! Please check your email and confirm your account before logging in.";

        form.reset();

      } catch (error) {
        message.style.color = "#ff7777";
        message.textContent =
          error.message || "Registration failed. Please try again.";

      } finally {
        button.disabled = false;
        button.textContent = "Create Account";
      }
    });
  </script>

</body>
  </html>
