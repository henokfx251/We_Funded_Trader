<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>Reset Password | WE FUNDED TRADER</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--gold:#e8b84b;--text:#f4f7fb;--muted:#94a3b8;--line:#26374d;--danger:#fb7185;--success:#4ade80}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%,rgba(232,184,75,.1),transparent 42%),var(--bg);font-family:Arial,sans-serif;color:var(--text)}
main{width:min(100%,460px);padding:32px;background:#101d30;border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 80px #0008}
.brand{text-align:center;font-size:22px;font-weight:900}.brand span{color:var(--gold)}h1{text-align:center;font-size:27px;margin:24px 0 8px}.sub{text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
label{display:block;margin:18px 0 7px;font-size:13px;font-weight:700}input{width:100%;height:48px;padding:0 13px;border:1px solid var(--line);border-radius:9px;background:#081525;color:var(--text);font-size:15px}
button{width:100%;height:49px;margin-top:22px;border:0;border-radius:9px;background:linear-gradient(135deg,#f5d27c,var(--gold));color:#101827;font-size:14px;font-weight:900;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}
#message{min-height:24px;text-align:center;font-size:13px;line-height:1.5;overflow-wrap:anywhere}.error{color:var(--danger)}.success{color:var(--success)}a{display:block;text-align:center;margin-top:18px;color:var(--gold);text-decoration:none;font-size:13px;font-weight:700}
</style>
<link rel="stylesheet" href="wft-global.css?v=8">
</head>
<body>
<main>
<div class="brand">WE <span>FUNDED</span> TRADER</div>
<h1>Set a New Password</h1>
<p class="sub">Choose a new password for your WFT account.</p>
<form id="form">
<label for="password">New Password</label>
<input id="password" type="password" minlength="8" autocomplete="new-password" required placeholder="At least 8 characters" disabled>
<label for="confirm">Confirm New Password</label>
<input id="confirm" type="password" minlength="8" autocomplete="new-password" required placeholder="Enter it again" disabled>
<button id="save" type="submit" disabled>VERIFYING RESET LINK...</button>
<p id="message" role="status" aria-live="polite">Verifying your secure reset link...</p>
</form>
<a href="Login.html">Back to Login</a>
</main>
<script type="module">
import { supabase } from "./supabase.js";

const form = document.getElementById("form");
const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirm");
const button = document.getElementById("save");
const message = document.getElementById("message");
let validSession = false;
let submitting = false;

function show(text, type = "") {
  message.textContent = text;
  message.className = type;
}
function enableForm() {
  validSession = true;
  password.disabled = false;
  confirmPassword.disabled = false;
  button.disabled = false;
  button.textContent = "UPDATE PASSWORD";
  show("Reset link verified. Enter your new password.", "success");
}
function disableForm(text) {
  validSession = false;
  password.disabled = true;
  confirmPassword.disabled = true;
  button.disabled = true;
  button.textContent = "LINK INVALID";
  show(text, "error");
}

async function verifyRecoveryLink() {
  try {
    // Supabase PKCE links return ?code=...; older implicit links return tokens in the URL hash.
    const url = new URL(window.location.href);
    const code = url.searchParams.get("code");
    const hash = new URLSearchParams(url.hash.replace(/^#/, ""));
    const accessToken = hash.get("access_token");
    const refreshToken = hash.get("refresh_token");
    const hashType = hash.get("type");

    if (code) {
      const { error } = await supabase.auth.exchangeCodeForSession(code);
      if (error) throw error;
      url.searchParams.delete("code");
      window.history.replaceState({}, document.title, url.pathname + url.search + url.hash);
    } else if (accessToken && refreshToken) {
      if (hashType && hashType !== "recovery") {
        throw new Error("This email link is not a password recovery link.");
      }
      const { error } = await supabase.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken
      });
      if (error) throw error;
      window.history.replaceState({}, document.title, url.pathname + url.search);
    }

    const { data, error } = await supabase.auth.getSession();
    if (error) throw error;
    if (!data.session) {
      throw new Error("The reset link is invalid, expired, or already used. Request a new reset email.");
    }
    enableForm();
  } catch (error) {
    console.error("WFT password recovery verification:", error);
    disableForm(error.message || "Could not verify this reset link. Request a new one.");
  }
}

supabase.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY" && session) enableForm();
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  if (!validSession || submitting) return;
  if (password.value.length < 8) {
    show("Password must be at least 8 characters.", "error");
    return;
  }
  if (password.value !== confirmPassword.value) {
    show("Passwords do not match.", "error");
    return;
  }

  submitting = true;
  button.disabled = true;
  button.textContent = "UPDATING...";
  try {
    const { error } = await supabase.auth.updateUser({ password: password.value });
    if (error) throw error;
    validSession = false;
    form.reset();
    password.disabled = true;
    confirmPassword.disabled = true;
    button.textContent = "UPDATED";
    show("Password updated successfully. You can now log in.", "success");
  } catch (error) {
    console.error("WFT password update:", error);
    button.disabled = false;
    button.textContent = "UPDATE PASSWORD";
    show(error.message || "Could not update your password. Request a new reset link and try again.", "error");
  } finally {
    submitting = false;
  }
});

verifyRecoveryLink();
</script>
</body>
</html>
