<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>Reset Password | WE FUNDED TRADER</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--gold:#e8b84b;--text:#f4f7fb;--muted:#94a3b8;--line:#26374d;--danger:#fb7185;--success:#4ade80}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%,rgba(232,184,75,.1),transparent 42%),var(--bg);font-family:Arial,sans-serif;color:var(--text)}
main{width:min(100%,460px);padding:32px;background:#101d30;border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 80px #0008}
.brand{text-align:center;font-size:22px;font-weight:900}.brand span{color:var(--gold)}h1{text-align:center;font-size:27px;margin:24px 0 8px}.sub{text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
label{display:block;margin:18px 0 7px;font-size:13px;font-weight:700}input{width:100%;height:48px;padding:0 13px;border:1px solid var(--line);border-radius:9px;background:#081525;color:var(--text);font-size:15px}
button{width:100%;height:49px;margin-top:22px;border:0;border-radius:9px;background:linear-gradient(135deg,#f5d27c,var(--gold));color:#101827;font-size:14px;font-weight:900}button:disabled{opacity:.55}
#message{min-height:24px;text-align:center;font-size:13px;line-height:1.5}.error{color:var(--danger)}.success{color:var(--success)}a{display:block;text-align:center;margin-top:18px;color:var(--gold);text-decoration:none;font-size:13px;font-weight:700}
</style>
<link rel="stylesheet" href="wft-global.css?v=6">
</head>
<body>
<main>
<div class="brand">WE <span>FUNDED</span> TRADER</div>
<h1>Set a New Password</h1>
<p class="sub">Choose a new password for your WFT account.</p>
<form id="form">
<label for="password">New Password</label>
<input id="password" type="password" minlength="8" autocomplete="new-password" required placeholder="At least 8 characters">
<label for="confirm">Confirm New Password</label>
<input id="confirm" type="password" minlength="8" autocomplete="new-password" required placeholder="Enter it again">
<button id="save" type="submit" disabled>UPDATE PASSWORD</button>
<p id="message" role="status" aria-live="polite">Verifying your secure reset link...</p>
</form>
<a href="Login.html">Back to Login</a>
</main>
<script type="module">
import { supabase } from "./supabase.js";
const form=document.getElementById("form");
const password=document.getElementById("password");
const confirmPassword=document.getElementById("confirm");
const button=document.getElementById("save");
const message=document.getElementById("message");
let validSession=false;
function show(text,type=""){message.textContent=text;message.className=type;}
const {data,error}=await supabase.auth.getSession();
if(!error && data.session){validSession=true;button.disabled=false;show("Reset link verified. Enter your new password.","success");}
else{show("This reset link is invalid or expired. Request a new one from Forgot Password.","error");}
form.addEventListener("submit",async(event)=>{
 event.preventDefault();
 if(!validSession){show("Please request a new reset link.","error");return;}
 if(password.value.length<8){show("Password must be at least 8 characters.","error");return;}
 if(password.value!==confirmPassword.value){show("Passwords do not match.","error");return;}
 button.disabled=true;button.textContent="UPDATING...";
 try{
  const {error:updateError}=await supabase.auth.updateUser({password:password.value});
  if(updateError) throw updateError;
  validSession=false;
  show("Password updated successfully. You can now log in.","success");
  form.reset();
  button.textContent="UPDATED";
 }catch(updateError){
  show(updateError.message||"Could not update your password. Request a new reset link and try again.","error");
  button.disabled=false;
  button.textContent="UPDATE PASSWORD";
 }
});
</script>
</body>
</html>
