
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>WFT Trading Terminal</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #07111f;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
}

.topbar {
  height: 48px;
  min-height: 48px;
  background: #0b1728;
  border-bottom: 1px solid #243852;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  color: white;
}

.brand {
  color: #42a5ff;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: .5px;
}

.actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

button {
  border: 1px solid #36516f;
  background: #142b46;
  color: white;
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
}

button:hover {
  background: #1c4168;
}

#chartArea {
  width: 100%;
  height: calc(100dvh - 48px);
  flex: 1;
  min-height: 0;
  background: #07111f;
}

.tradingview-widget-container {
  width: 100%;
  height: 100%;
}

.tradingview-widget-container__widget {
  width: 100%;
  height: 100%;
}

@media(max-width:600px) {
  .topbar {
    height: 44px;
    min-height: 44px;
    padding: 0 9px;
  }

  .brand {
    font-size: 13px;
  }

  button {
    padding: 7px 9px;
    font-size: 11px;
  }

  #chartArea {
    height: calc(100dvh - 44px);
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="brand">WE FUNDED TRADER</div>

  <div class="actions">
    <button onclick="goHome()">Home</button>
    <button onclick="fullScreen()">⛶ Full Screen</button>
  </div>
</header>

<main id="chartArea">

  <div class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget"></div>

    <script
      type="text/javascript"
      src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js"
      async>
    {
      "autosize": true,
      "symbol": "OANDA:XAUUSD",
      "interval": "15",
      "timezone": "Africa/Addis_Ababa",
      "theme": "dark",
      "style": "1",
      "locale": "en",
      "backgroundColor": "#07111f",
      "gridColor": "rgba(42, 65, 91, 0.35)",
      "allow_symbol_change": true,
      "hide_side_toolbar": false,
      "hide_top_toolbar": false,
      "hide_legend": false,
      "hide_volume": false,
      "save_image": true,
      "withdateranges": true,
      "details": false,
      "hotlist": false,
      "calendar": false,
      "watchlist": [
        "OANDA:EURUSD",
        "OANDA:GBPUSD",
        "OANDA:USDJPY",
        "OANDA:AUDUSD",
        "OANDA:USDCAD",
        "OANDA:USDCHF",
        "OANDA:NZDUSD",
        "OANDA:XAUUSD",
        "OANDA:XAGUSD",
        "BITSTAMP:BTCUSD",
        "COINBASE:BTCUSD",
        "BITSTAMP:ETHUSD"
      ],
      "support_host": "https://www.tradingview.com"
    }
    </script>
  </div>

</main>

<script>
function fullScreen() {
  const area = document.getElementById("chartArea");

  if (!document.fullscreenElement) {
    if (area.requestFullscreen) {
      area.requestFullscreen();
    }
  } else {
    document.exitFullscreen();
  }
}

function goHome() {
  window.location.href = "dashboard.html";
}
</script>

</body>
</html>
