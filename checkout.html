
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | We Funded Trader</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111f;color:white;font-family:Arial,sans-serif;padding:20px}
.container{max-width:520px;margin:35px auto;background:#102139;padding:25px;border-radius:15px}
h1{color:#42a5ff;text-align:center}
p{color:#b8c8dc}
.item{display:flex;justify-content:space-between;margin:17px 0;gap:12px}
input{width:100%;padding:13px;border-radius:7px;border:1px solid #38516e;background:#07111f;color:white;margin:10px 0}
button{width:100%;padding:14px;background:#1685ee;color:white;border:0;border-radius:8px;font-weight:bold;margin-top:15px}
button:disabled{opacity:.5}
#message{margin-top:15px;word-break:break-word}
.success{color:#55dc91}
.error{color:#ff7777}
a{color:#55adff}
</style>
</head>
<body>
<div class="container">
<h1>WE FUNDED TRADER</h1>
<h2>Checkout</h2>
<p>Review your challenge order.</p>

<div class="item"><span>Account Size</span><strong id="size">Loading...</strong></div>
<div class="item"><span>Challenge Type</span><strong id="type">Loading...</strong></div>
<div class="item"><span>Base Price</span><strong id="base">Loading...</strong></div>

<label for="coupon">Coupon Code</label>
<input id="coupon" placeholder="Enter coupon code">

<div class="item"><span>Discount</span><strong id="discount">$0.00</strong></div>
<div class="item"><strong>Final Price</strong><strong id="final">$0.00</strong></div>

<button id="orderButton" disabled>Place Order</button>
<div id="message"></div>
<p><a href="challenges.html">Back to Challenges</a></p>
<p><a href="orders.html">My Orders</a></p>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://vxcwfirfgxrxafbirnwu.supabase.co";
const SUPABASE_KEY = "sb_publishable_Nw1NaKkhz0A7H5TxybSzHA_9zjTeDLv";

const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const params = new URLSearchParams(window.location.search);
const size = Number(params.get("size"));
const type = (params.get("type") || "").toLowerCase();
const couponInput = document.getElementById("coupon");
const button = document.getElementById("orderButton");
const message = document.getElementById("message");

let basePrice = 0;
let discountPercent = 0;
let finalPrice = 0;

function showMessage(text, className="") {
  message.textContent = text;
  message.className = className;
}

function calculatePrice() {
  const code = couponInput.value.trim().toUpperCase();

  discountPercent = 0;
  if (code === "WFT10") discountPercent = 10;
  if (code === "WFT20") discountPercent = 20;

  const discountAmount = basePrice * discountPercent / 100;
  finalPrice = basePrice - discountAmount;

  document.getElementById("discount").textContent =
    "$" + discountAmount.toFixed(2);

  document.getElementById("final").textContent =
    "$" + finalPrice.toFixed(2);
}

async function initialize() {
  try {
    const { data: { session }, error } = await db.auth.getSession();

    if (error || !session) {
      window.location.href = "Login.html";
      return;
    }

    if (![2500,5000,10000,25000,50000,100000].includes(size)) {
      throw new Error("Invalid account size.");
    }

    if (!["evaluation","instant"].includes(type)) {
      throw new Error("Invalid challenge type.");
    }

    document.getElementById("size").textContent =
      "$" + size.toLocaleString();

    document.getElementById("type").textContent =
      type === "evaluation" ? "1-Step Evaluation" : "Instant Funding";

    const { data: price, error: priceError } = await db
      .from("challenge_prices")
      .select("base_price,evaluation_enabled,instant_enabled")
      .eq("account_size", size)
      .single();

    if (priceError) throw priceError;
    if (!price) throw new Error("Challenge price not found.");

    if (type === "evaluation" && !price.evaluation_enabled) {
      throw new Error("Evaluation is currently unavailable.");
    }

    if (type === "instant" && !price.instant_enabled) {
      throw new Error("Instant Funding is currently unavailable.");
    }

    basePrice = Number(price.base_price);

    if (!Number.isFinite(basePrice) || basePrice < 0) {
      throw new Error("Invalid challenge price.");
    }

    document.getElementById("base").textContent =
      "$" + basePrice.toFixed(2);

    couponInput.value = (params.get("coupon") || "").toUpperCase();
    calculatePrice();

    button.disabled = false;
    showMessage("Ready to place your order.");

  } catch (error) {
    showMessage(error.message || "Checkout loading failed.", "error");
  }
}

couponInput.addEventListener("input", calculatePrice);

button.addEventListener("click", async () => {
  button.disabled = true;
  button.textContent = "Processing...";
  showMessage("Creating your order...");

  try {
    const { data: { session }, error: sessionError } =
      await db.auth.getSession();

    if (sessionError || !session) {
      throw new Error("Please log in again.");
    }

    const couponCode = couponInput.value.trim().toUpperCase();

    const { data, error } = await db.functions.invoke("smart-handler", {
      body: {
        account_size: size,
        account_type: type,
        coupon_code: couponCode
      }
    });

    if (error) {
      throw new Error(error.message || "Edge Function request failed.");
    }

    if (!data || data.error) {
      throw new Error(data?.error || "Order creation failed.");
    }

    showMessage(
      "Order created successfully! Order ID: " +
      (data.order?.id || data.order_id || "Created") +
      ". Status: Pending.",
      "success"
    );

    button.textContent = "Order Created";

    setTimeout(() => {
      window.location.href = "orders.html";
    }, 2500);

  } catch (error) {
    showMessage("Order failed: " + error.message, "error");
    button.disabled = false;
    button.textContent = "Try Again";
  }
});

initialize();
</script>
</body>
  </html>
