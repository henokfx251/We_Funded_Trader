
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WFT Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111f;color:#fff;font-family:Arial,sans-serif}
header{background:#101f35;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:21px;color:#48a5ff;margin:0}
button{background:#1685ee;color:white;border:0;padding:10px 13px;border-radius:7px;cursor:pointer;font-weight:bold}
button:disabled{opacity:.5;cursor:not-allowed}
.reject{background:#c83c50}
main{padding:25px 5%;max-width:1400px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:20px 0}
.card{background:#11243b;padding:20px;border-radius:12px;border:1px solid #203b5c}
.card p{color:#a9bdd3;margin:0 0 12px}
.card h2{margin:0;color:#55adff}
.panel{background:#11243b;padding:18px;border-radius:12px;overflow-x:auto;margin-top:20px}
table{width:100%;border-collapse:collapse;min-width:1150px}
th,td{text-align:left;padding:12px;border-bottom:1px solid #29415c;font-size:13px;vertical-align:middle}
th{color:#55adff}
.status{padding:5px 9px;border-radius:6px;background:#35445a}
.message{padding:15px;color:#b9c9dc}
.error{color:#ff7373}
.success{color:#55dc91}
.txid{max-width:210px;overflow-wrap:anywhere;color:#c6d9ef}
.actions{display:flex;gap:7px}
a{color:#55adff}
</style>
</head>
<body>

<header>
<h1>WE FUNDED TRADER | ADMIN</h1>
<button id="logout">Logout</button>
</header>

<main>
<h2>Admin Dashboard</h2>
<p id="message" class="message">Checking admin access...</p>

<div id="content" style="display:none">
<div class="cards">
<div class="card"><p>Total Orders</p><h2 id="total">0</h2></div>
<div class="card"><p>Pending Orders</p><h2 id="pending">0</h2></div>
<div class="card"><p>Paid Orders</p><h2 id="paid">0</h2></div>
<div class="card"><p>Total Order Value</p><h2 id="value">$0.00</h2></div>
</div>

<div class="panel">
<h3>All Customer Orders & Payments</h3>
<table>
<thead>
<tr>
<th>Order ID</th>
<th>Customer ID</th>
<th>Account</th>
<th>Type</th>
<th>Final Price</th>
<th>Network</th>
<th>Transaction Hash</th>
<th>Status</th>
<th>Date</th>
<th>Admin Action</th>
</tr>
</thead>
<tbody id="orders"></tbody>
</table>
</div>
</div>
</main>

<script>
const SUPABASE_URL = "https://vxcwfirfgxrxafbirnwu.supabase.co";
const SUPABASE_KEY = "sb_publishable_Nw1NaKkhz0A7H5TxybSzHA_9zjTeDLv";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const message = document.getElementById("message");

function showMessage(text, type="message"){
 message.textContent = text;
 message.className = "message " + type;
}

function makeCell(row,text,className=""){
 const td=document.createElement("td");
 td.textContent=text;
 if(className) td.className=className;
 row.appendChild(td);
 return td;
}

function explorerUrl(network,txid){
 if(network==="BEP20"){
  return "https://bscscan.com/tx/"+encodeURIComponent(txid);
 }
 if(network==="TRC20"){
  return "https://tronscan.org/#/transaction/"+encodeURIComponent(txid);
 }
 return null;
}

async function reviewOrder(orderId,decision,button){
 const action=decision==="paid"?"approve":"reject";
 const confirmed=window.confirm(
  "Are you sure you want to "+action+" this order? Verify the TXID on the correct blockchain first."
 );
 if(!confirmed) return;

 button.disabled=true;
 button.textContent="Processing...";

 try{
  const {data,error}=await db.functions.invoke("admin-update-order",{
   body:{order_id:orderId,decision:decision}
  });

  if(error) throw new Error(error.message);
  if(!data || !data.success) throw new Error(data?.error || "Review failed.");

  showMessage("Order "+decision+" successfully.","success");
  await loadOrders();

 }catch(error){
  showMessage("Could not update order: "+error.message,"error");
  button.disabled=false;
  button.textContent=action==="approve"?"Approve":"Reject";
 }
}

async function loadOrders(){
 const {data:orders,error}=await db
  .from("orders")
  .select("*")
  .order("created_at",{ascending:false});

 if(error){
  showMessage("Could not load orders: "+error.message,"error");
  return;
 }

 document.getElementById("total").textContent=orders.length;
 document.getElementById("pending").textContent=
  orders.filter(o=>o.status==="pending").length;
 document.getElementById("paid").textContent=
  orders.filter(o=>o.status==="paid").length;

 const totalValue=orders.reduce((sum,o)=>sum+Number(o.final_price||0),0);
 document.getElementById("value").textContent="$"+totalValue.toFixed(2);

 const tbody=document.getElementById("orders");
 tbody.replaceChildren();

 if(orders.length===0){
  const tr=document.createElement("tr");
  makeCell(tr,"No orders found.");
  tbody.appendChild(tr);
  return;
 }

 orders.forEach(o=>{
  const tr=document.createElement("tr");

  makeCell(tr,String(o.id||"").slice(0,8));
  makeCell(tr,String(o.user_id||"").slice(0,8));
  makeCell(tr,"$"+Number(o.account_size).toLocaleString());
  makeCell(tr,o.account_type||"-");
  makeCell(tr,"$"+Number(o.final_price||0).toFixed(2));
  makeCell(tr,o.payment_network||"Not submitted");

  const txCell=makeCell(tr,o.transaction_hash||"Not submitted","txid");

  if(o.transaction_hash && o.payment_network){
   const link=document.createElement("a");
   link.href=explorerUrl(o.payment_network,o.transaction_hash);
   link.target="_blank";
   link.rel="noopener noreferrer";
   link.textContent="Open in Explorer";
   txCell.appendChild(document.createElement("br"));
   txCell.appendChild(link);
  }

  makeCell(tr,o.status||"-","status");
  makeCell(tr,o.created_at?new Date(o.created_at).toLocaleString():"-");

  const actionCell=document.createElement("td");
  const actions=document.createElement("div");
  actions.className="actions";

  if(o.status==="pending" && o.transaction_hash && o.payment_network){
   const approve=document.createElement("button");
   approve.textContent="Approve";
   approve.addEventListener("click",()=>reviewOrder(o.id,"paid",approve));

   const reject=document.createElement("button");
   reject.textContent="Reject";
   reject.className="reject";
   reject.addEventListener("click",()=>reviewOrder(o.id,"rejected",reject));

   actions.append(approve,reject);
  }else{
   actions.textContent=o.status==="pending"?"Waiting for TXID":"Reviewed";
  }

  actionCell.appendChild(actions);
  tr.appendChild(actionCell);
  tbody.appendChild(tr);
 });
}

async function loadAdmin(){
 const {data:{session},error:sessionError}=await db.auth.getSession();

 if(sessionError || !session){
  window.location.href="Login.html";
  return;
 }

 const {data:admin,error:adminError}=await db
  .from("admin_users")
  .select("user_id")
  .eq("user_id",session.user.id)
  .maybeSingle();

 if(adminError){
  showMessage("Admin verification failed: "+adminError.message,"error");
  return;
 }

 if(!admin){
  showMessage("Access denied. This account is not an admin.","error");
  return;
 }

 showMessage("Admin access verified.");
 document.getElementById("content").style.display="block";
 await loadOrders();
}

document.getElementById("logout").addEventListener("click",async()=>{
 await db.auth.signOut();
 window.location.href="Login.html";
});

loadAdmin();
</script>
</body>
</html>
