<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<meta name="robots" content="noindex">
<title>WE FUNDED TRADER | Payout Center</title>
<style>
html,body{min-height:100%;margin:0;background:#07111f;color:#f5f8fc;font-family:Arial,Helvetica,sans-serif}
.route-loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.route-card{max-width:420px;width:100%;padding:28px;border:1px solid rgba(59,130,246,.28);border-radius:18px;background:linear-gradient(145deg,#12243a,#0b1727);box-shadow:0 18px 50px #0005}
.route-mark{font-size:12px;letter-spacing:2px;font-weight:900;color:#60a5fa}
.route-title{margin:16px 0 8px;font-size:23px}
.route-copy{color:#9fb2c7;font-size:13px;line-height:1.7}
.route-spinner{width:26px;height:26px;margin:18px auto 0;border:3px solid #29415e;border-top-color:#60a5fa;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.route-spinner{animation:none}}
</style>
<script>
(function(){
  var target = "dashboard.html?page=payout";
  window.location.replace(target);
})();
</script>


<style id="wft-premium-blue-white">
:root{color-scheme:light!important;--bg:#fff!important;--sidebar:#fff!important;--panel:#fff!important;--panel2:#f3f7ff!important;--gold:#155eef!important;--gold2:#2563eb!important;--text:#111827!important;--muted:#475569!important;--line:#dbe5f2!important;--border:#dbe5f2!important;--blue:#155eef!important}
html,body{background:#fff!important;color:#111827!important}body{font-family:Inter,Arial,sans-serif!important}body :is(h1,h2,h3,h4,h5,h6,p,label,small,li,td,th,legend,summary,.muted,.text-muted,.description,.subtitle){color:#111827!important}body :is(a,.link){color:#155eef!important}body :is(input,select,textarea){background:#fff!important;color:#111827!important;border-color:#cbd5e1!important}body :is(input,select,textarea)::placeholder{color:#64748b!important;opacity:1}body :is(button,.btn,[type=button],[type=submit]){background-color:#155eef!important;color:#fff!important;border-color:#155eef!important}body :is(.card,.panel,.box,.modal-content,.dropdown-menu,.sidebar,.topbar,.navbar,.header,.form-card,.auth-card,.stat-card,.challenge-card,.order-card,.content-card){background-color:#fff!important;color:#111827!important;border-color:#dbe5f2!important;box-shadow:0 8px 28px rgba(15,35,75,.07)!important}body :is(.sidebar a,.nav-link,.menu-item){color:#1f2937!important}body :is(.sidebar a.active,.nav-link.active,.menu-item.active){background:#eaf1ff!important;color:#155eef!important}body :is(.chartbox,.tradingview-widget-container,.tv-lightweight-charts,.chart-container){background:#0b1726!important}
</style>
<link rel="stylesheet" href="wft-global.css?v=27">
</head>
<body>
<main class="route-loading">
  <section class="route-card">
    <div class="route-mark">WE FUNDED TRADER</div>
    <h1 class="route-title">Payout Center</h1>
    <p class="route-copy">Opening your secure customer dashboard…</p>
    <div class="route-spinner" aria-hidden="true"></div>
    <noscript><p class="route-copy">JavaScript is required. <a href="dashboard.html?page=payout">Continue to Payout Center</a>.</p></noscript>
  </section>
</main>
</body>
</html>
