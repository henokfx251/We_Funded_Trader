<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">
  <title>Forgot Password | WE FUNDED TRADER</title>
  <style>
    :root{color-scheme:dark;--bg:#07111f;--gold:#e8b84b;--gold2:#f5d27c;--text:#f4f7fb;--muted:#94a3b8;--line:#26374d;--danger:#fb7185;--success:#4ade80}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%,rgba(232,184,75,.10),transparent 42%),var(--bg);font-family:Inter,Arial,sans-serif;color:var(--text)}
    a{color:var(--gold);font-weight:700;text-decoration:none}.auth-shell{width:min(100%,460px)}.brand{text-align:center;margin-bottom:22px}.brand-name{font-size:22px;font-weight:900;letter-spacing:.8px}.brand-name span{color:var(--gold)}.brand-caption{margin-top:7px;color:var(--muted);font-size:12px;letter-spacing:2px;text-transform:uppercase}.brand-line{width:52px;height:3px;border-radius:9px;background:var(--gold);margin:15px auto 0}
    .card{padding:34px;background:linear-gradient(160deg,rgba(20,36,58,.98),rgba(16,29,48,.98));border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 80px rgba(0,0,0,.35)}.eyebrow{text-align:center;color:var(--gold);font-size:11px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase}h1{text-align:center;font-size:28px;margin:13px 0 8px}.subtitle{text-align:center;color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 25px}
    label{display:block;margin:0 0 8px;color:#d5deea;font-size:13px;font-weight:700}input{display:block;width:100%;height:49px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:#081525;color:var(--text);font-size:15px;outline:none}input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,184,75,.12)}
    .submit{width:100%;min-height:50px;margin-top:22px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#101827;font-size:15px;font-weight:900;cursor:pointer}.submit:disabled{opacity:.6;cursor:wait}.message{min-height:24px;margin:14px 0 0;text-align:center;font-size:13px;line-height:1.55;overflow-wrap:anywhere}.error{color:var(--danger)}.success{color:var(--success)}.back{text-align:center;margin-top:22px;color:var(--muted);font-size:13px}
    @media(max-width:520px){body{padding:16px}.card{padding:28px 21px}}
  </style>
<link rel="stylesheet" href="wft-global.css?v=7">
</head>
<body>
  <main class="auth-shell">
    <header class="brand"><div class="brand-name">WE <span>FUNDED</span> TRADER</div><div class="brand-caption">Trade with confidence</div><div class="brand-line"></div></header>
    <section class="card">
      <div class="eyebrow">Account Recovery</div>
      <h1>Forgot Password?</h1>
      <p class="subtitle">Enter the email address linked to your WFT account. We will send a secure password reset link if an account matches.</p>
      <form id="resetRequestForm" novalidate>
        <label for="email">Email Address</label>
        <input id="email" type="email" autocomplete="email" inputmode="email" placeholder="name@example.com" required>
        <button class="submit" id="sendButton" type="submit">SEND RESET LINK</button>
        <p class="message" id="message" role="status" aria-live="polite"></p>
      </form>
    </section>
    <div class="back"><a href="Login.html">← Back to Login</a></div>
  </main>
  <script type="module">
    import { supabase } from "./supabase.js";
    const form=document.getElementById("resetRequestForm");
    const emailInput=document.getElementById("email");
    const button=document.getElementById("sendButton");
    const message=document.getElementById("message");
    function showMessage(text,type=""){message.textContent=text;message.className="message "+type;}
    form.addEventListener("submit",async(event)=>{
      event.preventDefault();
      const email=emailInput.value.trim();
      if(!email){showMessage("Please enter your email address.","error");return;}
      button.disabled=true;button.textContent="SENDING...";
      showMessage("Please wait...");
      try{
        const redirectTo=new URL("reset-password.html",window.location.href).href;
        const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo});
        if(error) throw error;
        showMessage("If this email is registered, a password reset link has been sent. Check Inbox and Spam.","success");
        form.reset();
      }catch(error){showMessage(error.message||"Could not send the reset email. Please try again.","error");}
      finally{button.disabled=false;button.textContent="SEND RESET LINK";}
    });
  </script>
</body>
</html>
